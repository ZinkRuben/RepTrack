# Konténerben futó alkalmazás (a Dockerfile állítja be: SPRING_PROFILES_ACTIVE=docker).
# HTTPS a 8443-as porton önaláírt tanúsítvánnyal; a 8080-as port csak HTTPS-re irányít át.
# A tanúsítványt és a jelszavát a docker/entrypoint.sh készíti első induláskor (a jelszó a
# SERVER_SSL_KEY_STORE_PASSWORD környezeti változóban érkezik, a repóban nincs).

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:${REPTRACK_CERT_DIR:/certs}/reptrack.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=reptrack

# HTTP -> HTTPS átirányítás (HttpsConfig, SecurityConfig). A nyilvános portok a gazdagépen látható portok:
# a docker-compose.yml a HTTP_PORT / HTTPS_PORT értékét adja át, így más portokkal is helyes címre irányít.
reptrack.https.http-port=8080
reptrack.https.public-http-port=${REPTRACK_PUBLIC_HTTP_PORT:8080}
reptrack.https.public-https-port=${REPTRACK_PUBLIC_HTTPS_PORT:8443}

# HSTS alapból kikapcsolva: önaláírt tanúsítványnál a localhost-on a böngésző minden portra (a fejlesztői
# http://localhost:8080-ra is) HTTPS-t erőltetne. Valódi domainnél és tanúsítványnál kapcsold be: REPTRACK_HTTPS_HSTS=true
reptrack.https.hsts=${REPTRACK_HTTPS_HSTS:false}

server.servlet.session.cookie.secure=true
spring.thymeleaf.cache=true
