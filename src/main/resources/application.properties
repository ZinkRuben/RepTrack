spring.application.name=reptrack

# Adatbázis (fejlesztéshez a docker-compose.yml-ben lévő PostgreSQL; környezeti változókkal felülírható)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reptrack}
spring.datasource.username=${DB_USER:reptrack}
spring.datasource.password=${DB_PASSWORD:reptrack}

# A séma kizárólag a Flyway migrációkból épül fel, a Hibernate csak ellenőriz
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Az alkalmazás magyar nyelvű: a számok és dátumok formája (tizedesvessző, 2026. 11. 23.) ne a böngésző nyelvétől függjön
spring.web.locale=hu_HU
spring.web.locale-resolver=fixed

# A ${...} értékek környezeti változóból jönnek; helyben a projekt gyökerében lévő .env fájlból is
# (DotEnvEnvironmentPostProcessor, UTF-8; a .env nem kerül a repóba, minta: .env.example).

# Az első adminisztrátor (AdminBootstrap): csak környezeti változóból vagy .env-ből, a repóban nincs érték
reptrack.admin.email=${REPTRACK_ADMIN_EMAIL:}
reptrack.admin.password=${REPTRACK_ADMIN_PASSWORD:}
reptrack.admin.name=${REPTRACK_ADMIN_NAME:Adminisztrátor}

# Demófelhasználó 16 hétnyi mintaadattal (DemoDataSeeder); alapból kikapcsolva
reptrack.demo.enabled=${REPTRACK_DEMO_ENABLED:false}

# A hét- és hónaphatárok, valamint a napi bontás időzónája (a statisztikák ebben számolnak)
reptrack.timezone=Europe/Budapest
