<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Regisztráció – RepTrack</title></head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">Regisztráció</h1>

                    <!-- novalidate: a hibákat a szerver ellenőrzi és magyarul jelzi a mezők alatt -->
                    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="displayName">Név</label>
                            <input class="form-control" type="text" th:field="*{displayName}" th:errorclass="is-invalid"
                                   autocomplete="name" maxlength="100" required autofocus>
                            <div class="invalid-feedback" th:errors="*{displayName}">Add meg a neved.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">E-mail-cím</label>
                            <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid"
                                   autocomplete="email" maxlength="255" required>
                            <div class="invalid-feedback" th:errors="*{email}">Érvénytelen e-mail-cím.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Jelszó</label>
                            <input class="form-control" type="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password') or #fields.hasErrors('passwordWithinLimit')} ? 'is-invalid'"
                                   autocomplete="new-password" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">A jelszó legalább 8 karakter legyen.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordWithinLimit')}"
                                 th:errors="*{passwordWithinLimit}">A jelszó túl hosszú.</div>
                            <div class="form-text">Legalább 8 karakter.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="passwordConfirm">Jelszó még egyszer</label>
                            <input class="form-control" type="password" th:field="*{passwordConfirm}"
                                   th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'"
                                   autocomplete="new-password" required>
                            <div class="invalid-feedback" th:errors="*{passwordConfirmed}">A két jelszó nem egyezik.</div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Regisztráció</button>
                    </form>

                    <p class="small text-body-secondary text-center mt-4 mb-0">
                        Van már fiókod? <a th:href="@{/login}">Jelentkezz be!</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
