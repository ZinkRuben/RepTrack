<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Siker- és hibaüzenet a tartalom fölött, bezárható. A modell "successMessage" és "errorMessage" attribútumait
  jeleníti meg (a nevek a FlashMessages osztályban). Átirányítás után flash attribútumként, azonos kérésben
  modellattribútumként adható át.
-->
<div th:fragment="messages" class="container pt-3" th:if="${successMessage != null or errorMessage != null}">
    <div class="alert alert-success alert-dismissible fade show mb-0" role="status" th:if="${successMessage != null}">
        <span th:text="${successMessage}">Sikeres mentés.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show mb-0" role="alert" th:if="${errorMessage != null}"
         th:classappend="${successMessage != null} ? 'mt-2'">
        <span th:text="${errorMessage}">Hiba történt.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Bezárás"></button>
    </div>
</div>

</body>
</html>
