<!DOCTYPE html>
<!--
  Közös oldalváz: fej (betűtípus, Bootstrap, ikonok, saját téma), navigációs sáv, üzenetek, tartalom, lábléc.

  Használat egy új oldalon (csak a <title> és a <main> az oldal saját része, a többit a váz adja):

    <!DOCTYPE html>
    <html lang="hu" xmlns:th="http://www.thymeleaf.org"
          th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
    <head><title>Oldal címe – RepTrack</title></head>
    <body>
    <main class="container py-4">
        <div class="page-header">
            <div>
                <h1 class="page-title">Oldal címe</h1>
                <p class="page-subtitle">Rövid leírás.</p>
            </div>
            <a class="btn btn-primary" href="..."><i class="bi bi-plus-lg"></i> Művelet</a>
        </div>
        ... az oldal tartalma ...
    </main>
    </body>
    </html>

  Ikonok: Bootstrap Icons (<i class="bi bi-..."></i>). Saját komponensek és színek: static/css/app.css.
  Közös darabok (kategória-címke, üres állapot): fragments/ui.html.
  Oldalspecifikus szkript (pl. Chart.js) a <main> végére kerülhet.
  Üzenetek: a controller a FlashMessages osztállyal ad sikert/hibát (átirányítás után is megjelenik).
-->
<html lang="hu" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:replace="${title}">RepTrack</title>

    <!-- a téma beállítása még a megjelenítés előtt, hogy ne villanjon (a váltást a js/app.js kezeli) -->
    <script>
        (function () {
            var mode = 'auto';
            try { mode = localStorage.getItem('reptrack-theme') || 'auto'; } catch (e) { }
            if (mode !== 'light' && mode !== 'dark') {
                mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', mode);
        })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.1.0/index.css"
          integrity="sha384-6QsiPFEuz7gYJPDZq103sCr5aKoBCbqAXJq1fEUzeUHeJmXFTMGzGuUmfP4j5w5b"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div th:replace="~{fragments/messages :: messages}"></div>

<main th:replace="${content}"></main>

<footer class="app-footer mt-auto py-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="d-inline-flex align-items-center gap-2">
            <span class="brand-mark" style="width: 1.4rem; height: 1.4rem; font-size: .75rem; border-radius: .45rem;">
                <i class="bi bi-activity" aria-hidden="true"></i>
            </span>
            <span><strong>RepTrack</strong> · Edzéskövető és elemző alkalmazás</span>
        </span>
        <span>Szoftverarchitektúrák házi feladat · 2026</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
