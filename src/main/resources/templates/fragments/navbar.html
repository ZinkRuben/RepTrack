<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Navigációs sáv: logó, menüpontok (bejelentkezve), témaváltó, felhasználói menü (név, kijelentkezés) vagy
  vendégként bejelentkezés és regisztráció. Görgetéskor fent marad; mobilon a menü összecsukható.

  Új menüpont (az aktív állapotot az URL eleje alapján kapja; az ikon a Bootstrap Icons neve):
    <li th:replace="~{fragments/navbar :: navLink('/workouts', 'Edzésnapló', 'bi-journal-text')}"></li>
  Csak adminisztrátornak: tegyétek egy sec:authorize="hasRole('ADMIN')" elem belsejébe.
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top app-navbar">
    <div class="container">
        <a class="navbar-brand d-inline-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-activity" aria-hidden="true"></i></span>
            <span>RepTrack</span>
        </a>

        <!-- jobb oldal: mobilon is látszik (a menü csak bejelentkezve csukódik össze) -->
        <div class="d-flex align-items-center gap-1 order-lg-last ms-auto">
            <!-- témaváltó -->
            <div class="dropdown">
                <button class="btn btn-ghost btn-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        aria-label="Téma váltása" title="Téma">
                    <i class="bi bi-circle-half" data-theme-icon aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button class="dropdown-item" type="button" data-theme-value="light">
                        <i class="bi bi-sun-fill" aria-hidden="true"></i> Világos</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-value="dark">
                        <i class="bi bi-moon-stars-fill" aria-hidden="true"></i> Sötét</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-value="auto">
                        <i class="bi bi-circle-half" aria-hidden="true"></i> Rendszer szerint</button></li>
                </ul>
            </div>

            <!-- bejelentkezett felhasználó -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="btn btn-ghost d-inline-flex align-items-center gap-2 px-2" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Felhasználói menü">
                    <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</span>
                    <span class="d-none d-md-inline text-truncate text-body" style="max-width: 14rem;"
                          sec:authentication="name">felhasznalo@example.com</span>
                    <span class="badge rounded-pill text-bg-warning" sec:authorize="hasRole('ADMIN')">Admin</span>
                    <i class="bi bi-chevron-down small" aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" style="min-width: 15rem;">
                    <li class="px-3 py-2">
                        <div class="small text-body-secondary">Bejelentkezve</div>
                        <div class="fw-semibold text-truncate" th:text="${#authentication.name}">felhasznalo@example.com</div>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item" th:href="@{/profile}">
                            <i class="bi bi-person-gear" aria-hidden="true"></i> Profil és célok
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/account/password}">
                            <i class="bi bi-key" aria-hidden="true"></i> Jelszó módosítása
                        </a>
                    </li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button class="dropdown-item text-danger" type="submit">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Kijelentkezés
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

            <!-- vendég (keskeny kijelzőn a bejelentkezés gomb az oldal tartalmában van, a sáv így egy sorban marad) -->
            <div class="d-flex align-items-center gap-1" sec:authorize="!isAuthenticated()">
                <a class="btn btn-ghost btn-sm d-none d-sm-inline-block" th:href="@{/login}">Bejelentkezés</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Regisztráció</a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Menü megnyitása"
                    sec:authorize="hasRole('USER')">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <!-- menüpontok; hasRole('USER'): a szerepkör-hierarchia miatt az adminisztrátor is látja -->
        <div class="collapse navbar-collapse" id="mainNav" sec:authorize="hasRole('USER')">
            <ul class="navbar-nav gap-lg-1 ms-lg-4 py-2 py-lg-0">
                <li th:replace="~{fragments/navbar :: navLink('/workouts', 'Edzésnapló', 'bi-journal-text')}"></li>
                <li th:replace="~{fragments/navbar :: navLink('/exercises', 'Gyakorlatok', 'bi-collection')}"></li>
                <li th:replace="~{fragments/navbar :: navLink('/stats', 'Statisztika', 'bi-graph-up')}"></li>
                <li th:replace="~{fragments/navbar :: navLink('/records', 'Csúcsok', 'bi-trophy')}"></li>
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li th:replace="~{fragments/navbar :: navLink('/admin/users', 'Felhasználók', 'bi-people')}"></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<!--
  Egy menüpont; aktív, ha a kért út a megadott úttal kezdődik (pl. /exercises és /exercises/12).
  A currentPath-t a LayoutModelAdvice adja; ahol nincs (pl. kivételkezelő hibaoldala), egyik menüpont sem aktív.
-->
<li th:fragment="navLink(path, label, icon)" class="nav-item"
    th:with="active=${currentPath != null and #strings.startsWith(currentPath, path)}">
    <a class="nav-link" th:href="@{${path}}"
       th:classappend="${active} ? 'active'" th:attr="aria-current=${active} ? 'page' : null">
        <i class="bi" th:classappend="${icon}" aria-hidden="true"></i><span th:text="${label}">Menüpont</span>
    </a>
</li>

</body>
</html>
