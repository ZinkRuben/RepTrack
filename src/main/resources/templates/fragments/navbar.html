<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Navigációs sáv: bejelentkezve a menüpontok, a felhasználó neve és a kijelentkezés; vendégként bejelentkezés és
  regisztráció. Mobilon összecsukható (a Bootstrap JS-t a layout tölti be).

  Új menüpont (az aktív állapotot az URL eleje alapján kapja):
    <li th:replace="~{fragments/navbar :: navLink('/workouts', 'Edzésnapló')}"></li>
  Csak adminisztrátornak: tegyétek egy sec:authorize="hasRole('ADMIN')" elem belsejébe.
-->
<nav th:fragment="navbar" class="navbar navbar-expand-md bg-dark border-bottom" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">RepTrack</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Menü megnyitása">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <!-- hasRole('USER'): a szerepkör-hierarchia miatt az adminisztrátor is látja -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('USER')">
                <li th:replace="~{fragments/navbar :: navLink('/exercises', 'Gyakorlatok')}"></li>
            </ul>

            <!-- bejelentkezett felhasználó -->
            <div class="d-flex flex-column flex-md-row align-items-md-center gap-2 ms-md-auto py-2 py-md-0"
                 sec:authorize="isAuthenticated()">
                <span class="navbar-text text-truncate" style="max-width: 16rem;">
                    <span sec:authentication="name">felhasznalo@example.com</span>
                    <span class="badge text-bg-warning ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-sm btn-outline-light" type="submit">Kijelentkezés</button>
                </form>
            </div>

            <!-- vendég -->
            <div class="d-flex gap-2 ms-md-auto py-2 py-md-0" sec:authorize="!isAuthenticated()">
                <a class="btn btn-sm btn-outline-light" th:href="@{/login}">Bejelentkezés</a>
                <a class="btn btn-sm btn-primary" th:href="@{/register}">Regisztráció</a>
            </div>
        </div>
    </div>
</nav>

<!--
  Egy menüpont; aktív, ha a kért út a megadott úttal kezdődik (pl. /exercises és /exercises/12).
  A currentPath-t a LayoutModelAdvice adja; ahol nincs (pl. kivételkezelő hibaoldala), egyik menüpont sem aktív.
-->
<li th:fragment="navLink(path, label)" class="nav-item"
    th:with="active=${currentPath != null and #strings.startsWith(currentPath, path)}">
    <a class="nav-link" th:href="@{${path}}" th:text="${label}"
       th:classappend="${active} ? 'active'" th:attr="aria-current=${active} ? 'page' : null">Menüpont</a>
</li>

</body>
</html>
