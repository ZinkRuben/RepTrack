<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Edzésnapló – RepTrack</title></head>
<body>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Edzésnapló</h1>
        <a class="btn btn-primary" th:href="@{/workouts/new}">+ Új edzés</a>
    </div>

    <!-- nyugtázatlan túlterhelési figyelmeztetések -->
    <div class="card border-warning mb-3" th:unless="${openWarnings.isEmpty()}">
        <div class="card-header bg-warning-subtle fw-semibold">Figyelmeztetések</div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2"
                th:each="w : ${openWarnings}">
                <div>
                    <span th:text="${w.message()}">Figyelmeztetés szövege.</span>
                    <span class="text-body-secondary small ms-1" th:text="${#temporals.format(w.eventDate(), 'yyyy. MM. dd.')}">2026. 11. 21.</span>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-secondary" th:if="${w.workoutId() != null}"
                       th:href="@{/workouts/{id}(id=${w.workoutId()})}">Edzés</a>
                    <form th:action="@{/warnings/{id}/acknowledge(id=${w.id()})}" method="post">
                        <input type="hidden" name="back" value="/workouts">
                        <button class="btn btn-sm btn-outline-dark" type="submit">Nyugtázom</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>

    <!-- szűrők: GET kérés, így a szűrt lista linkként megosztható -->
    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/workouts}">
        <div class="col-6 col-md-2">
            <label class="form-label small mb-1" for="from">Ettől</label>
            <input class="form-control" id="from" name="from" type="date" th:value="${from}">
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label small mb-1" for="to">Eddig</label>
            <input class="form-control" id="to" name="to" type="date" th:value="${to}">
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label small mb-1" for="exerciseId">Gyakorlat</label>
            <select class="form-select" id="exerciseId" name="exerciseId">
                <option value="">Mind</option>
                <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.name()}"
                        th:selected="${o.id() == exerciseId}">Guggolás</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="category">Kategória</label>
            <select class="form-select" id="category" name="category">
                <option value="">Mind</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${#messages.msg('category.' + c)}"
                        th:selected="${c == category}">Súlyzós</option>
            </select>
        </div>
        <div class="col-6 col-md-2 d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" type="submit">Szűrés</button>
            <a class="btn btn-outline-secondary" th:href="@{/workouts}" title="Szűrők törlése">✕</a>
        </div>
    </form>

    <p class="text-body-secondary small mb-2" th:text="|${totalElements} edzés|">12 edzés</p>

    <div class="alert alert-info" th:if="${items.isEmpty()}">
        Nincs a szűrésnek megfelelő edzés.
        <a th:href="@{/workouts/new}">Rögzítsd az elsőt!</a>
    </div>

    <div class="table-responsive" th:unless="${items.isEmpty()}">
        <table class="table table-hover align-middle bg-body">
            <thead>
            <tr>
                <th>Időpont</th>
                <th>Edzés</th>
                <th class="text-end">Idő</th>
                <th class="text-end">Fáradtság</th>
                <th class="text-end">Gyakorlat</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="w : ${items}">
                <td class="text-nowrap" th:text="${#temporals.format(w.startedAt(), 'yyyy. MM. dd. HH:mm')}">2026. 11. 21. 18:00</td>
                <td>
                    <a class="fw-semibold text-decoration-none" th:href="@{/workouts/{id}(id=${w.id()})}"
                       th:text="${w.title()}">Lábnap</a>
                    <span class="badge text-bg-secondary ms-1" th:unless="${w.closed()}">nyitott</span>
                </td>
                <td class="text-end text-nowrap" th:text="${w.minutes() != null} ? |${w.minutes()} perc| : '–'">60 perc</td>
                <td class="text-end" th:text="${w.fatigue() != null} ? |${w.fatigue()}/10| : '–'">7/10</td>
                <td class="text-end" th:text="${w.exerciseCount()}">3</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/workouts/{id}(id=${w.id()})}">Megnyitás</a>
                    <form class="d-inline" th:action="@{/workouts/{id}/copy(id=${w.id()})}" method="post">
                        <button class="btn btn-sm btn-outline-secondary" type="submit" title="Új edzés ennek a másolataként">Másolás</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Oldalak">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageNumber == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/workouts(page=${pageNumber - 1}, from=${from}, to=${to}, exerciseId=${exerciseId}, category=${category})}">Előző</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="|${pageNumber + 1} / ${totalPages}|">1 / 3</span></li>
            <li class="page-item" th:classappend="${pageNumber + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/workouts(page=${pageNumber + 1}, from=${from}, to=${to}, exerciseId=${exerciseId}, category=${category})}">Következő</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
