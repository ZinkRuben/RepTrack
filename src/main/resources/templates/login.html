<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Bejelentkezés – RepTrack</title></head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">Bejelentkezés</h1>

                    <!-- A POST /login-t a Spring Security dolgozza fel; a CSRF-tokent a th:action teszi bele. -->
                    <form th:action="@{/login}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="email">E-mail-cím</label>
                            <input class="form-control" id="email" name="email" type="email" th:value="${email}"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Jelszó</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Bejelentkezés</button>
                    </form>

                    <p class="small text-body-secondary text-center mt-4 mb-0">
                        Még nincs fiókod? <a th:href="@{/register}">Regisztrálj!</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
