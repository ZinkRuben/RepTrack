<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>RepTrack</title></head>
<body>
<main class="container py-5">
    <h1 class="display-5 fw-semibold">RepTrack</h1>
    <p class="lead text-body-secondary">
        Edzéskövető és elemző alkalmazás: rögzítsd az edzéseidet, kövesd a fejlődésedet, és nézd meg a statisztikáidat.
    </p>

    <div class="d-flex flex-wrap gap-2 mt-4" sec:authorize="!isAuthenticated()">
        <a class="btn btn-primary btn-lg" th:href="@{/register}">Regisztráció</a>
        <a class="btn btn-outline-secondary btn-lg" th:href="@{/login}">Bejelentkezés</a>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-4" sec:authorize="isAuthenticated()">
        <a class="btn btn-primary btn-lg" th:href="@{/exercises}">Gyakorlatok</a>
    </div>
</main>
</body>
</html>
